</style><body><header><a href="#" id="logo">✦ <b>GDQP<span>&</span>AN</b><small>KHÔNG GIAN ÔN LUYỆN</small></a><button id="home">Tổng quan ↗</button></header><main id="app"></main><footer>Học chắc kiến thức · Vững vàng bước vào hội thi<br>Chấm theo đáp án trong tài liệu gốc. Chưa thẩm định tính chính xác và hiệu lực các nội dung.</footer><script>const QUESTIONS=[{"id": 1, "set": 1, "number": 1, "level": "Nhận biết", "text": "Theo Điều 11 Luật Giáo dục quốc phòng và an ninh, giáo dục quốc phòng và an ninh trong trường trung học phổ thông được xác định là gì?", "options": ["Môn học chính khoá", "Nội dung lồng ghép trong các môn học khác", "Hoạt động ngoại khoá bắt buộc", "Môn học tự chọn theo nguyện vọng của học sinh"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 11 khoản 1.", "explanation": ""}, {"id": 2, "set": 1, "number": 2, "level": "Nhận biết", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, tổng thời lượng của cả môn học là bao nhiêu tiết?", "options": ["140 tiết, mỗi lớp 35 tiết và 35 tiết ngoại khoá", "105 tiết, trong đó lớp 12 học 45 tiết", "105 tiết, mỗi lớp 35 tiết", "70 tiết, mỗi lớp 35 tiết ở lớp 10 và lớp 11"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.2.1.", "explanation": ""}, {"id": 3, "set": 1, "number": 3, "level": "Nhận biết", "text": "Theo Luật Giáo dục quốc phòng và an ninh, cơ quan nào chủ trì, phối hợp với Bộ Công an, Bộ Giáo dục và Đào tạo giúp Chính phủ thực hiện quản lý nhà nước về giáo dục quốc phòng và an ninh?", "options": ["Bộ Giáo dục và Đào tạo", "Bộ Nội vụ", "Bộ Quốc phòng", "Bộ Công an"], "answer": 2, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 33 khoản 2.", "explanation": ""}, {"id": 4, "set": 1, "number": 4, "level": "Nhận biết", "text": "Theo Luật Giáo dục (sửa đổi năm 2025), tuổi của học sinh vào học lớp mười là bao nhiêu?", "options": ["15 tuổi và được tính theo năm", "16 tuổi và được tính theo năm", "14 tuổi và được tính theo năm", "15 tuổi và được tính đủ theo ngày, tháng sinh"], "answer": 0, "source": "Luật số 123/2025/QH15 sửa đổi, bổ sung Luật Giáo dục, Điều 1 khoản 7 (sửa đổi Điều 28 Luật Giáo dục).", "explanation": ""}, {"id": 5, "set": 1, "number": 5, "level": "Nhận biết", "text": "Đội Việt Nam Tuyên truyền Giải phóng quân được thành lập ngày 22/12/1944 gồm bao nhiêu chiến sĩ?", "options": ["34 chiến sĩ, biên chế thành 2 trung đội", "44 chiến sĩ, biên chế thành 4 tiểu đội", "22 chiến sĩ, biên chế thành 3 tiểu đội", "34 chiến sĩ, biên chế thành 3 tiểu đội"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, tr. 5.", "explanation": ""}, {"id": 6, "set": 1, "number": 6, "level": "Nhận biết", "text": "Theo Luật Biên giới quốc gia, biên giới quốc gia trên đất liền được hoạch định và đánh dấu trên thực địa bằng gì?", "options": ["Đường tuần tra biên giới", "Hệ thống biển báo khu vực biên giới", "Hệ thống mốc quốc giới", "Các toạ độ trên hải đồ"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), tr. 6.", "explanation": ""}, {"id": 7, "set": 1, "number": 7, "level": "Nhận biết", "text": "Thủ đô Phnom Penh của Campuchia được hoàn toàn giải phóng khỏi chế độ diệt chủng Pol Pot vào ngày nào?", "options": ["Ngày 7/1/1979", "Ngày 2/12/1978", "Ngày 23/12/1978", "Ngày 17/2/1979"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), tr. 6.", "explanation": ""}, {"id": 8, "set": 1, "number": 8, "level": "Nhận biết", "text": "Cơ quan nào thực hiện đăng kí nghĩa vụ quân sự cho công dân cư trú tại địa phương?", "options": ["Công an cấp xã", "Ban Chỉ huy quân sự cấp xã", "Hội đồng nghĩa vụ quân sự cấp tỉnh", "Uỷ ban nhân dân cấp tỉnh"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), tr. 12.", "explanation": ""}, {"id": 9, "set": 1, "number": 9, "level": "Thông hiểu", "text": "Nội dung nào sau đây là yêu cầu bảo đảm đối với học sinh trung học phổ thông khi học giáo dục quốc phòng và an ninh theo Điều 11 Luật Giáo dục quốc phòng và an ninh?", "options": ["Hình thành những cơ sở hiểu biết ban đầu về truyền thống dựng nước và giữ nước của dân tộc; ý thức kỷ luật, tinh thần đoàn kết, yêu Tổ quốc, yêu đồng bào", "Có hiểu biết ban đầu về nền quốc phòng toàn dân, an ninh nhân dân; có kiến thức cơ bản, cần thiết về phòng thủ dân sự và kỹ năng quân sự; sẵn sàng thực hiện nghĩa vụ quân sự bảo vệ Tổ quốc", "Nắm vững tình hình, nhiệm vụ quốc phòng và an ninh; khu vực phòng thủ; kết hợp kinh tế với quốc phòng và an ninh", "Có kiến thức cơ bản về xây dựng thế trận quốc phòng toàn dân gắn với thế trận an ninh nhân dân, xây dựng lực lượng vũ trang nhân dân"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 11 khoản 2 (so sánh với Điều 10, 12, 13).", "explanation": ""}, {"id": 10, "set": 1, "number": 10, "level": "Thông hiểu", "text": "Theo Luật Giáo dục quốc phòng và an ninh, đội ngũ giáo viên, giảng viên giáo dục quốc phòng và an ninh bao gồm những thành phần nào?", "options": ["Giáo viên chuyên trách, tuyên truyền viên và cán bộ quân đội biệt phái", "Giáo viên, giảng viên chuyên trách, thỉnh giảng và cán bộ quân đội, công an biệt phái", "Giáo viên chuyên trách, giáo viên kiêm nhiệm và báo cáo viên", "Giáo viên cơ hữu, giáo viên hợp đồng và sĩ quan dự bị"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 23 khoản 1.", "explanation": ""}, {"id": 11, "set": 1, "number": 11, "level": "Thông hiểu", "text": "Theo Thông tư 22/2021/TT-BGDĐT, kết quả học tập môn Giáo dục quốc phòng và an ninh của học sinh trung học phổ thông được đánh giá theo hình thức nào?", "options": ["Đánh giá bằng nhận xét kết hợp đánh giá bằng điểm số, theo thang điểm 10", "Chỉ đánh giá bằng điểm số, không nhận xét", "Chỉ đánh giá bằng nhận xét theo hai mức Đạt, Chưa đạt", "Đánh giá bằng nhận xét theo bốn mức Tốt, Khá, Đạt, Chưa đạt"], "answer": 0, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 5 khoản 3 (môn GDQPAN không thuộc nhóm môn đánh giá bằng nhận xét tại điểm a).", "explanation": ""}, {"id": 12, "set": 1, "number": 12, "level": "Thông hiểu", "text": "Quan điểm “tính mở, liên thông” trong xây dựng Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông được thể hiện ở nội dung nào?", "options": ["Chương trình được xây dựng trên nền tảng kinh nghiệm đánh giặc giữ nước của cha ông và cập nhật thành tựu khoa học quân sự hiện đại", "Chương trình giúp học sinh nhận thức đúng về chủ nghĩa yêu nước, tinh thần dân tộc, nhân văn", "Chương trình dành thời lượng nhất định để nhà trường hướng dẫn học sinh tìm hiểu truyền thống và nghệ thuật đánh giặc giữ nước của địa phương", "Chương trình xác định thực hành, luyện tập, vận dụng là nội dung quan trọng để phát triển phẩm chất, năng lực"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục II.5.", "explanation": ""}, {"id": 13, "set": 1, "number": 13, "level": "Thông hiểu", "text": "Nguyên tắc nào sau đây được quy định tại Điều 5 Luật Giáo dục quốc phòng và an ninh?", "options": ["Giáo dục quốc phòng và an ninh là trách nhiệm của ngành giáo dục, trong đó nhà trường giữ vai trò chủ đạo", "Giáo dục quốc phòng và an ninh là trách nhiệm của hệ thống chính trị và toàn dân, trong đó Nhà nước giữ vai trò chủ đạo", "Giáo dục quốc phòng và an ninh là trách nhiệm riêng của lực lượng vũ trang nhân dân", "Giáo dục quốc phòng và an ninh do các tổ chức xã hội tự nguyện thực hiện, Nhà nước hỗ trợ kinh phí"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 5 khoản 2.", "explanation": ""}, {"id": 14, "set": 1, "number": 14, "level": "Thông hiểu", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, khi dạy các bài thực hành, giáo viên cần vận dụng phương pháp nào?", "options": ["Chủ yếu nêu vấn đề, tạo tình huống có vấn đề để học sinh vận dụng kinh nghiệm sẵn có tự hình thành kiến thức mới", "Thuyết trình kết hợp với làm động tác mẫu trên vũ khí, trang bị và giáo cụ trực quan; bảo đảm an toàn tuyệt đối", "Giao học sinh tự nghiên cứu tài liệu, giáo viên chỉ kiểm tra kết quả cuối buổi", "Thuyết trình toàn bộ nội dung trên lớp, không yêu cầu luyện tập trên bãi tập"], "answer": 1, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VI.2.2.", "explanation": ""}, {"id": 15, "set": 1, "number": 15, "level": "Thông hiểu", "text": "Theo Luật Nhà giáo năm 2025, trình độ chuẩn được đào tạo của giáo viên trung học phổ thông là gì?", "options": ["Có bằng cử nhân trở lên của bất kì ngành nào, không cần chứng chỉ nghiệp vụ sư phạm", "Có bằng tốt nghiệp cao đẳng sư phạm trở lên, không phân biệt môn học và cấp học giảng dạy", "Có bằng thạc sĩ trở lên thuộc ngành đào tạo giáo viên phù hợp với môn học, cấp học giảng dạy", "Có bằng cử nhân trở lên thuộc ngành đào tạo giáo viên phù hợp, hoặc bằng cử nhân chuyên ngành phù hợp và chứng chỉ nghiệp vụ sư phạm"], "answer": 3, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 28 khoản 1 điểm b.", "explanation": ""}, {"id": 16, "set": 1, "number": 16, "level": "Thông hiểu", "text": "Bản chất của Quân đội nhân dân Việt Nam được sách giáo khoa lớp 10 xác định như thế nào?", "options": ["Mang bản chất của giai cấp công nhân, hoạt động độc lập với các tổ chức chính trị", "Mang bản chất của giai cấp nông dân, đặt dưới sự chỉ huy trực tiếp của Chính phủ", "Mang bản chất của toàn dân tộc, không mang bản chất giai cấp", "Mang bản chất của giai cấp công nhân, tính nhân dân và tính dân tộc sâu sắc"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, tr. 7.", "explanation": ""}, {"id": 17, "set": 1, "number": 17, "level": "Thông hiểu", "text": "Nét nổi bật của nghệ thuật quân sự Việt Nam trong kháng chiến chống Mỹ cứu nước (1954 – 1975) là gì?", "options": ["Từng bước thực hiện các trận đánh lớn, tác chiến hiệp đồng quân, binh chủng", "Chỉ tiến hành phòng ngự, không tổ chức tiến công quy mô lớn", "Chủ yếu đánh bí mật, nhanh chóng, di chuyển linh hoạt với các đội vũ trang nhỏ", "Chủ yếu vận dụng lối đánh du kích quy mô cấp tiểu đội, trung đội, đại đội"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, tr. 6.", "explanation": ""}, {"id": 18, "set": 1, "number": 18, "level": "Thông hiểu", "text": "Điểm khác nhau cơ bản giữa phòng ngừa và đấu tranh chống vi phạm pháp luật về trật tự an toàn giao thông là gì?", "options": ["Phòng ngừa là ngăn chặn không để vi phạm xảy ra; đấu tranh chống là phát hiện vi phạm đã xảy ra để xử lý", "Phòng ngừa do cơ quan nhà nước thực hiện; đấu tranh chống do công dân thực hiện", "Phòng ngừa chỉ áp dụng với giao thông đường bộ; đấu tranh chống áp dụng với mọi loại hình giao thông", "Phòng ngừa là xử phạt người vi phạm; đấu tranh chống là tuyên truyền pháp luật"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, tr. 22, 26.", "explanation": ""}, {"id": 19, "set": 1, "number": 19, "level": "Thông hiểu", "text": "Theo Luật An ninh mạng năm 2018, an ninh mạng được hiểu là gì?", "options": ["Môi trường trong đó thông tin được cung cấp, truyền đưa, thu thập, xử lý, lưu trữ và trao đổi thông qua mạng viễn thông và mạng máy tính", "Việc cài đặt phần mềm diệt vi-rút có bản quyền cho mọi thiết bị kết nối mạng", "Hoạt động kiểm soát toàn bộ nội dung trao đổi cá nhân của người dùng trên mạng", "Sự bảo đảm hoạt động trên không gian mạng không gây phương hại đến an ninh quốc gia, trật tự, an toàn xã hội, quyền và lợi ích hợp pháp của cơ quan, tổ chức, cá nhân"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, tr. 31.", "explanation": ""}, {"id": 20, "set": 1, "number": 20, "level": "Thông hiểu", "text": "Theo quan điểm về đối tác, đối tượng trong Chiến lược bảo vệ Tổ quốc, những ai được xác định là đối tác của Việt Nam?", "options": ["Chỉ những nước có cùng chế độ chính trị và cùng mục tiêu xây dựng chủ nghĩa xã hội với Việt Nam", "Chỉ những nước láng giềng có chung đường biên giới trên đất liền hoặc trên biển với Việt Nam", "Những ai tôn trọng độc lập, chủ quyền, thiết lập và mở rộng quan hệ hữu nghị, hợp tác bình đẳng, cùng có lợi với Việt Nam", "Những nước có quan hệ thương mại lớn với Việt Nam, không phụ thuộc thái độ về chủ quyền"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), tr. 6.", "explanation": ""}, {"id": 21, "set": 1, "number": 21, "level": "Thông hiểu", "text": "Tệ nạn xã hội được hiểu như thế nào?", "options": ["Là hành vi nguy hiểm cho xã hội được quy định trong Bộ luật Hình sự, do người có năng lực trách nhiệm hình sự thực hiện", "Là mọi hành vi trái với phong tục, tập quán của địa phương", "Là hành vi sử dụng công nghệ cao tác động trái pháp luật đến thông tin số", "Là hiện tượng xã hội tiêu cực, biểu hiện bằng những hành vi sai lệch chuẩn mực xã hội, vi phạm đạo đức, pháp luật và gây nguy hiểm cho xã hội"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), tr. 21.", "explanation": ""}, {"id": 22, "set": 1, "number": 22, "level": "Thông hiểu", "text": "Theo pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ, “dao có tính sát thương” được xếp vào loại nào?", "options": ["Vũ khí quân dụng", "Vũ khí thô sơ", "Công cụ hỗ trợ", "Vũ khí thể thao"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), tr. 47.", "explanation": ""}, {"id": 23, "set": 1, "number": 23, "level": "Thông hiểu", "text": "Chiến lược “diễn biến hoà bình” được hiểu là gì?", "options": ["Hành động chống phá bằng bạo lực, có tổ chức do lực lượng phản động, li khai tiến hành nhằm gây rối loạn an ninh chính trị hoặc lật đổ chính quyền", "Chiến lược do chủ nghĩa đế quốc và các thế lực phản động tiến hành nhằm lật đổ chế độ chính trị của các nước tiến bộ từ bên trong, chủ yếu bằng biện pháp phi quân sự", "Chính sách ngoại giao hoà bình giữa các nước có chế độ chính trị khác nhau", "Chiến lược dùng sức mạnh quân sự tiến công từ bên ngoài để xoá bỏ chế độ xã hội chủ nghĩa"], "answer": 1, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), tr. 31.", "explanation": ""}, {"id": 24, "set": 1, "number": 24, "level": "Thông hiểu", "text": "Theo sách giáo khoa lớp 12, Dân quân tự vệ được tổ chức như thế nào?", "options": ["Là lực lượng thường trực được tổ chức ở cấp tỉnh, do cơ quan quân sự địa phương trực tiếp chỉ huy", "Là lực lượng chuyên trách quản lí, bảo vệ biên giới quốc gia, khu vực biên giới", "Là lực lượng vũ trang quần chúng không thoát li sản xuất, công tác; tổ chức ở địa phương gọi là dân quân, ở cơ quan, tổ chức gọi là tự vệ", "Là một thành phần của Quân đội nhân dân, gồm quân nhân dự bị và phương tiện kĩ thuật dự bị được sắp xếp vào đơn vị dự bị động viên"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), tr. 39.", "explanation": ""}, {"id": 25, "set": 1, "number": 25, "level": "Vận dụng", "text": "Môn Giáo dục quốc phòng và an ninh lớp 11 có 35 tiết/năm học. Theo Thông tư 22/2021/TT-BGDĐT, trong mỗi học kì, mỗi học sinh có những điểm đánh giá nào ở môn học này?", "options": ["04 điểm đánh giá thường xuyên, 01 điểm đánh giá giữa kì và 01 điểm đánh giá cuối kì", "02 điểm đánh giá thường xuyên, 01 điểm đánh giá giữa kì và 01 điểm đánh giá cuối kì", "03 điểm đánh giá thường xuyên, 01 điểm đánh giá giữa kì và 01 điểm đánh giá cuối kì", "02 điểm đánh giá thường xuyên và 01 điểm đánh giá cuối kì"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 6 khoản 2 điểm b; Điều 7 khoản 3.", "explanation": ""}, {"id": 26, "set": 1, "number": 26, "level": "Vận dụng", "text": "Trong học kì I, môn Giáo dục quốc phòng và an ninh, học sinh A có hai điểm đánh giá thường xuyên là 8 và 9, điểm đánh giá giữa kì là 7, điểm đánh giá cuối kì là 8. Theo Thông tư 22/2021/TT-BGDĐT, điểm trung bình môn học kì của A là bao nhiêu?", "options": ["7,8", "7,9", "8,3", "8,0"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 9 khoản 1 điểm b: (8 + 9 + 2×7 + 3×8) : (2 + 5) = 55 : 7 ≈ 7,9.", "explanation": ""}, {"id": 27, "set": 1, "number": 27, "level": "Vận dụng", "text": "Học sinh B bị tai nạn gãy chân, phải điều trị trong học kì II. Theo Thông tư 22/2021/TT-BGDĐT, việc học môn Giáo dục quốc phòng và an ninh của B được giải quyết như thế nào?", "options": ["B được miễn toàn bộ môn học và không phải kiểm tra, đánh giá", "Giáo viên bộ môn tự quyết định cho B nghỉ học, lấy điểm học kì I làm điểm cả năm", "B phải bảo lưu kết quả và học lại môn học vào năm học sau", "B được hiệu trưởng cho miễn học phần thực hành và được kiểm tra, đánh giá thay thế bằng nội dung lý thuyết"], "answer": 3, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 10 khoản 1, 3, 4.", "explanation": ""}, {"id": 28, "set": 1, "number": 28, "level": "Vận dụng", "text": "Tổ chuyên môn của một trường trung học phổ thông dự kiến xếp 5 tiết thực hành “Kĩ thuật sử dụng lựu đạn” học liên tục trong một buổi để “dứt điểm” bài. Theo hướng dẫn thực hiện Chương trình môn Giáo dục quốc phòng và an ninh, cách xếp này có phù hợp không?", "options": ["Phù hợp, vì bài thực hành phải dạy dứt điểm trong một buổi", "Không phù hợp, vì bài thực hành chỉ được dạy 1 tiết/tuần theo phân phối chương trình", "Không phù hợp, vì các bài thực hành dạy tập trung theo lớp, dứt điểm theo bài nhưng không quá 3 tiết/buổi/tuần", "Phù hợp, vì chương trình cho phép nhà trường tự quyết định không giới hạn số tiết mỗi buổi"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VIII.5.1.", "explanation": ""}, {"id": 29, "set": 1, "number": 29, "level": "Vận dụng", "text": "Thầy C có bằng tốt nghiệp đại học sư phạm Giáo dục thể chất, được nhà trường dự kiến phân công dạy môn Giáo dục quốc phòng và an ninh. Để đạt trình độ chuẩn giáo viên giáo dục quốc phòng và an ninh, thầy C cần có thêm điều kiện nào?", "options": ["Có thời gian phục vụ tại ngũ trong quân đội từ đủ 24 tháng", "Chỉ cần có quyết định phân công của hiệu trưởng", "Có giấy chứng nhận hoàn thành chương trình bồi dưỡng kiến thức quốc phòng và an ninh đối tượng 4", "Có chứng chỉ đào tạo giáo viên, giảng viên giáo dục quốc phòng và an ninh"], "answer": 3, "source": "Nghị định 13/2014/NĐ-CP (VBHN số 53/VBHN-BQP ngày 09/9/2025), Điều 6 khoản 1; Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 23 khoản 2.", "explanation": ""}, {"id": 30, "set": 1, "number": 30, "level": "Vận dụng", "text": "Nam (đủ 16 tuổi) điều khiển xe mô tô hai bánh dung tích xi-lanh 110 cm³ chở hai bạn cùng lớp, cả ba đều không đội mũ bảo hiểm. Theo nội dung sách giáo khoa lớp 10, Nam đã vi phạm những quy định nào?", "options": ["Điều khiển loại xe không được phép lái ở độ tuổi của mình, chở quá một người và không đội mũ bảo hiểm", "Chỉ vi phạm quy định về đội mũ bảo hiểm", "Không vi phạm, vì học sinh đủ 16 tuổi được lái mọi loại xe hai bánh và được chở hai người", "Chỉ vi phạm quy định về số người được chở và đội mũ bảo hiểm"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, tr. 24.", "explanation": ""}, {"id": 31, "set": 1, "number": 31, "level": "Vận dụng", "text": "Trên đường đi học, một nhóm học sinh đi xe đạp tới nơi đường bộ giao nhau với đường sắt không có đèn tín hiệu, rào chắn và chuông báo hiệu, thấy tàu hoả đang đi tới. Nhóm học sinh cần xử lí như thế nào?", "options": ["Tăng tốc đi qua trước khi tàu tới để không ùn tắc", "Dừng lại cách ray gần nhất 1 m và đi qua ngay khi đầu tàu vừa qua", "Dừng sát mép ray để quan sát cho rõ rồi đi qua", "Dừng lại cách ray gần nhất tối thiểu 5 m, chờ tàu đi qua rồi mới đi"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, tr. 25.", "explanation": ""}, {"id": 32, "set": 1, "number": 32, "level": "Vận dụng", "text": "Cho các việc làm sau: (1) chia sẻ thông tin sai sự thật về tình hình dịch bệnh lên trang cá nhân; (2) trao đổi học tập qua thư điện tử; (3) chơi bài trực tuyến đổi điểm lấy tiền mặt hoặc thẻ cào; (4) chia sẻ hình ảnh quảng bá du lịch của địa phương. Những việc nào không được làm khi tham gia không gian mạng?", "options": ["(1) và (3)", "(3) và (4)", "(1) và (2)", "(2) và (4)"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, tr. 32 – 33.", "explanation": ""}, {"id": 33, "set": 1, "number": 33, "level": "Vận dụng", "text": "Anh D, 26 tuổi, vừa tốt nghiệp đại học; trước đây anh đã được tạm hoãn gọi nhập ngũ vì đang học đại học. Theo Luật Nghĩa vụ quân sự, anh D có còn trong độ tuổi gọi nhập ngũ không?", "options": ["Không, vì độ tuổi gọi nhập ngũ chỉ từ đủ 18 tuổi đến hết 25 tuổi trong mọi trường hợp", "Còn, vì độ tuổi gọi nhập ngũ kéo dài đến hết 30 tuổi đối với mọi công dân", "Không, vì người đã tốt nghiệp đại học được miễn gọi nhập ngũ", "Còn, vì trường hợp đã được tạm hoãn để học cao đẳng, đại học thì độ tuổi gọi nhập ngũ đến hết 27 tuổi"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), tr. 13.", "explanation": ""}, {"id": 34, "set": 1, "number": 34, "level": "Vận dụng", "text": "Trong buổi lao động tại vườn trường, một học sinh phát hiện vật thể nghi là lựu đạn cũ. Cách xử lí nào đúng với trách nhiệm của học sinh?", "options": ["Chụp ảnh đăng lên mạng xã hội để hỏi cách xử lí, sau đó tiếp tục lao động như bình thường", "Mang về nhà cất giữ làm kỉ niệm", "Không tự ý di chuyển, tháo gỡ; báo ngay cho thầy, cô giáo, cơ quan công an hoặc cơ quan quân sự địa phương", "Rủ bạn tháo ra để tìm hiểu cấu tạo, phục vụ bài học"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), tr. 48 – 49.", "explanation": ""}, {"id": 35, "set": 1, "number": 35, "level": "Vận dụng", "text": "Trong chuyến tham quan cột mốc biên giới, một bạn trong lớp có ý định vượt qua mốc giới sang nước bạn để hái hoa rừng. Lời khuyên nào phù hợp với quy định của Luật Biên giới quốc gia?", "options": ["Có thể sang nếu chỉ đi một đoạn ngắn và quay lại ngay", "Có thể sang vì khu vực biên giới trên đất liền là nơi công dân hai nước tự do qua lại", "Không được vượt qua mốc giới, vì qua lại trái phép biên giới quốc gia là hành vi bị nghiêm cấm", "Có thể sang nếu có thầy, cô giáo đi cùng"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), tr. 7, 10.", "explanation": ""}, {"id": 36, "set": 1, "number": 36, "level": "Vận dụng", "text": "Một học sinh lớp 12 thấy trên mạng xã hội bài viết chưa rõ nguồn gốc kêu gọi tụ tập đông người để “phản đối chính quyền địa phương”. Việc làm nào đúng với trách nhiệm của học sinh trong phòng, chống chiến lược “diễn biến hoà bình”, bạo loạn lật đổ?", "options": ["Lưu bài viết và gửi vào nhóm lớp để các bạn bàn luận", "Chia sẻ bài viết để nhiều người cùng biết và tự đánh giá", "Không “LIKE”, không chia sẻ thông tin chưa được kiểm chứng; không để bị kích động, lôi kéo tụ tập", "Bình luận tranh cãi gay gắt, kêu gọi bạn bè cùng đến nơi tụ tập để xem thực hư"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), tr. 37.", "explanation": ""}, {"id": 37, "set": 1, "number": 37, "level": "Vận dụng cao", "text": "Cuối năm học, học sinh H có điểm trung bình môn cả năm của 7 môn đánh giá bằng điểm số đều từ 8,0 trở lên, riêng môn Giáo dục quốc phòng và an ninh đạt 4,8; các môn đánh giá bằng nhận xét đều ở mức Đạt. Theo Thông tư 22/2021/TT-BGDĐT, kết quả học tập cả năm của H được đánh giá ở mức nào?", "options": ["Mức Tốt, vì có trên 06 môn đạt từ 8,0 điểm trở lên", "Mức Khá, vì chỉ do một môn mà thấp xuống hai mức nên được điều chỉnh lên mức liền kề", "Mức Chưa đạt, vì có một môn dưới 5,0 điểm", "Mức Đạt, vì có một môn dưới 5,0 điểm và Thông tư không có quy định điều chỉnh mức đánh giá"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 9 khoản 2 và khoản 3.", "explanation": ""}, {"id": 38, "set": 1, "number": 38, "level": "Vận dụng cao", "text": "Một trường trung học phổ thông xây dựng kế hoạch như sau: (1) tổ chức giáo dục quốc phòng và an ninh như một hoạt động ngoại khoá tự chọn thay cho giờ học chính khoá; (2) dạy và học theo phân phối chương trình; (3) phối hợp với cơ quan quân sự địa phương tổ chức cho học sinh học tập ngoại khoá. Đối chiếu Điều 11 Luật Giáo dục quốc phòng và an ninh, nhận định nào đúng?", "options": ["Nội dung (1) trái quy định vì đây là môn học chính khoá; nội dung (2) và (3) đúng quy định", "Nội dung (3) trái quy định vì hoạt động ngoại khoá chỉ áp dụng ở tiểu học, trung học cơ sở", "Nội dung (1) và (2) đúng quy định; nội dung (3) trái quy định vì nhà trường không được phối hợp với đơn vị ngoài", "Cả ba nội dung đều đúng quy định"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 11 khoản 1, khoản 3.", "explanation": ""}, {"id": 39, "set": 1, "number": 39, "level": "Vận dụng cao", "text": "Khi bàn về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ, có ba ý kiến: (1) chiến lược “diễn biến hoà bình” chỉ tập trung vào lĩnh vực tư tưởng, văn hoá; (2) thủ đoạn duy nhất của các thế lực thù địch là đòi phi chính trị hoá Quân đội nhân dân và Công an nhân dân; (3) lực lượng tiến hành bạo loạn lật đổ chỉ là các tổ chức phản động người Việt Nam ở nước ngoài. Nhận định nào đúng?", "options": ["Cả ba ý kiến đều chưa đúng", "Chỉ ý kiến (1) đúng", "Chỉ ý kiến (3) đúng", "Ý kiến (1) và (2) đúng, ý kiến (3) sai"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), tr. 32 – 34, 37 (các thế lực thù địch chống phá toàn diện trên mọi lĩnh vực; lực lượng tiến hành gồm cả phản động trong và ngoài nước, phần tử cơ hội, bất mãn).", "explanation": ""}, {"id": 40, "set": 1, "number": 40, "level": "Vận dụng cao", "text": "Cho ba nhận định: (1) cuộc chiến tranh bảo vệ biên giới Tây Nam là hành động tự vệ chính đáng và chính nghĩa của Nhân dân Việt Nam; (2) trong chiến đấu bảo vệ biên giới phía Bắc, ta quán triệt tư tưởng “lấy nhỏ đánh lớn, lấy ít địch nhiều”; (3) trong đấu tranh bảo vệ chủ quyền biển, đảo, ta chỉ sử dụng biện pháp quân sự do Hải quân nhân dân tiến hành. Đánh giá nào đúng?", "options": ["Chỉ nhận định (3) đúng", "Nhận định (1) sai; nhận định (2) và (3) đúng", "Cả ba nhận định đều đúng", "Nhận định (1) và (2) đúng; nhận định (3) sai"], "answer": 3, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), tr. 7, 9, 11 (đấu tranh bảo vệ chủ quyền biển, đảo kết hợp chính trị, kinh tế, ngoại giao, pháp lí, quân sự; kiên định biện pháp hoà bình).", "explanation": ""}, {"id": 41, "set": 2, "number": 1, "level": "Nhận biết", "text": "Theo Luật Giáo dục quốc phòng và an ninh, cơ quan thường trực của Hội đồng giáo dục quốc phòng và an ninh ở cấp xã là cơ quan nào?", "options": ["Ban chỉ huy quân sự cấp xã", "Văn phòng Uỷ ban nhân dân cấp xã", "Phòng văn hoá – xã hội cấp xã", "Công an cấp xã"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 44 khoản 3.", "explanation": ""}, {"id": 42, "set": 2, "number": 2, "level": "Nhận biết", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, mạch nội dung môn học được cấu trúc theo bao nhiêu chủ đề?", "options": ["06 chủ đề", "04 chủ đề", "05 chủ đề", "03 chủ đề"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục V.1.", "explanation": ""}, {"id": 43, "set": 2, "number": 3, "level": "Nhận biết", "text": "Theo Nghị quyết số 248/2025/QH15, một bộ sách giáo khoa giáo dục phổ thông sử dụng thống nhất toàn quốc được thực hiện từ năm học nào?", "options": ["Năm học 2030 – 2031", "Năm học 2027 – 2028", "Năm học 2025 – 2026", "Năm học 2026 – 2027"], "answer": 3, "source": "Nghị quyết số 248/2025/QH15, Điều 3 khoản 1.", "explanation": ""}, {"id": 44, "set": 2, "number": 4, "level": "Nhận biết", "text": "Thông tư số 19/2022/TT-BGDĐT ban hành Danh mục thiết bị dạy học tối thiểu môn học Giáo dục quốc phòng và an ninh có hiệu lực thi hành kể từ ngày nào?", "options": ["Ngày 01/01/2023", "Ngày 26/01/2018", "Ngày 22/12/2022", "Ngày 06/02/2023"], "answer": 3, "source": "Thông tư 19/2022/TT-BGDĐT, Điều 2.", "explanation": ""}, {"id": 45, "set": 2, "number": 5, "level": "Nhận biết", "text": "Ngày truyền thống của lực lượng Dân quân tự vệ là ngày nào?", "options": ["Ngày 22/12/1944", "Ngày 28/3/1935", "Ngày 19/8/1945", "Ngày 19/12/1946"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, tr. 9.", "explanation": ""}, {"id": 46, "set": 2, "number": 6, "level": "Nhận biết", "text": "Công an nhân dân Việt Nam được thành lập vào ngày nào?", "options": ["Ngày 19/8/1945", "Ngày 2/9/1945", "Ngày 28/3/1935", "Ngày 22/12/1944"], "answer": 0, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, tr. 7.", "explanation": ""}, {"id": 47, "set": 2, "number": 7, "level": "Nhận biết", "text": "Ngày 5/3/1979, trước cuộc tiến công xâm lược ở biên giới phía Bắc, Chủ tịch nước Cộng hoà xã hội chủ nghĩa Việt Nam đã ra lệnh gì?", "options": ["Lệnh Tổng động viên trong cả nước", "Lệnh giới nghiêm ở các tỉnh biên giới", "Lệnh động viên cục bộ ở các tỉnh phía Bắc", "Lệnh thiết quân luật trên toàn quốc"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), tr. 8.", "explanation": ""}, {"id": 48, "set": 2, "number": 8, "level": "Nhận biết", "text": "Theo thủ tục đăng kí nghĩa vụ quân sự lần đầu, Chủ tịch Uỷ ban nhân dân cấp xã quyết định gọi công dân đăng kí nghĩa vụ quân sự lần đầu vào tháng nào hằng năm?", "options": ["Tháng Hai", "Tháng Mười một", "Tháng Tư", "Tháng Một"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), tr. 12.", "explanation": ""}, {"id": 49, "set": 2, "number": 9, "level": "Thông hiểu", "text": "Mục tiêu giáo dục quốc phòng và an ninh quy định tại Điều 4 Luật Giáo dục quốc phòng và an ninh là gì?", "options": ["Giáo dục cho công dân về kiến thức quốc phòng và an ninh để phát huy tinh thần yêu nước, nâng cao ý thức, trách nhiệm, tự giác thực hiện nhiệm vụ quốc phòng và an ninh", "Tuyển chọn những công dân có đủ tiêu chuẩn về chính trị, sức khoẻ để đào tạo sĩ quan quân đội và công an", "Trang bị cho mọi công dân kỹ năng sử dụng thành thạo các loại vũ khí, khí tài hiện đại của lực lượng vũ trang nhân dân", "Đào tạo công dân trở thành quân nhân dự bị, sẵn sàng bổ sung cho lực lượng thường trực của Quân đội nhân dân khi có chiến tranh"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 4.", "explanation": ""}, {"id": 50, "set": 2, "number": 10, "level": "Thông hiểu", "text": "Theo Luật Giáo dục quốc phòng và an ninh, “kỹ năng quân sự” được hiểu là gì?", "options": ["Khả năng chỉ huy, điều hành đơn vị trong huấn luyện và chiến đấu", "Khả năng thực hành những nội dung cơ bản cần thiết về kỹ thuật, chiến thuật quân sự", "Trình độ lí luận về nghệ thuật quân sự Việt Nam qua các thời kì", "Hệ thống quan điểm của Đảng, chính sách, pháp luật của Nhà nước về quốc phòng và an ninh"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 3 khoản 2.", "explanation": ""}, {"id": 51, "set": 2, "number": 11, "level": "Thông hiểu", "text": "Theo Luật Giáo dục quốc phòng và an ninh, chế độ trang phục đối với giáo viên, giảng viên giáo dục quốc phòng và an ninh được quy định như thế nào?", "options": ["Được bảo đảm chế độ trang phục, trừ cán bộ quân đội, công an biệt phái", "Giáo viên tự trang bị trang phục theo mẫu do nhà trường quy định", "Chỉ cán bộ quân đội, công an biệt phái được bảo đảm chế độ trang phục", "Chỉ giáo viên chuyên trách ở trung tâm giáo dục quốc phòng và an ninh được cấp trang phục"], "answer": 0, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 25 khoản 2.", "explanation": ""}, {"id": 52, "set": 2, "number": 12, "level": "Thông hiểu", "text": "Theo Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, hoạt động nào sau đây thuộc đánh giá thường xuyên không chính thức?", "options": ["Thi tốt nghiệp trung học phổ thông", "Kiểm tra thực hành cuối năm học", "Quan sát trên lớp, kiểm tra bài cũ, đối thoại, học sinh tự đánh giá", "Kiểm tra cuối học kì bằng trắc nghiệm khách quan và tự luận"], "answer": 2, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục VII.1.", "explanation": ""}, {"id": 53, "set": 2, "number": 13, "level": "Thông hiểu", "text": "Theo mục tiêu của Chương trình môn Giáo dục quốc phòng và an ninh cấp trung học phổ thông, môn học giúp học sinh phát triển những phẩm chất nào?", "options": ["Nhân ái, chăm chỉ, tự chủ, sáng tạo", "Trung thực, kỉ luật, đoàn kết, kiên trì", "Yêu nước, chăm chỉ, kỉ luật, dũng cảm", "Yêu nước, nhân ái, trung thực, trách nhiệm"], "answer": 3, "source": "Thông tư 46/2020/TT-BGDĐT, Chương trình môn GDQPAN cấp THPT, mục III.", "explanation": ""}, {"id": 54, "set": 2, "number": 14, "level": "Thông hiểu", "text": "Theo Luật Giáo dục (sửa đổi năm 2025), học sinh học hết chương trình giáo dục trung học phổ thông nhưng không dự thi hoặc thi không đạt yêu cầu thì được giải quyết như thế nào?", "options": ["Được hiệu trưởng nhà trường cấp giấy chứng nhận hoàn thành chương trình giáo dục phổ thông", "Được hiệu trưởng nhà trường xác nhận học bạ việc hoàn thành chương trình, không cấp giấy tờ khác", "Được Sở Giáo dục và Đào tạo cấp bằng tốt nghiệp trung học phổ thông loại trung bình", "Phải học lại lớp mười hai mới được xem xét cấp giấy chứng nhận"], "answer": 0, "source": "Luật số 123/2025/QH15 sửa đổi, bổ sung Luật Giáo dục, Điều 1 khoản 9 (sửa đổi Điều 34 Luật Giáo dục).", "explanation": ""}, {"id": 55, "set": 2, "number": 15, "level": "Thông hiểu", "text": "Theo Luật Nhà giáo năm 2025, việc nào sau đây tổ chức, cá nhân không được làm đối với nhà giáo?", "options": ["Tham gia đánh giá nhà giáo theo quy định của pháp luật", "Đề nghị nhà trường công khai kết quả học tập, rèn luyện của học sinh", "Đăng tải, phát tán thông tin mang tính quy kết về trách nhiệm của nhà giáo khi chưa có kết luận của cơ quan có thẩm quyền", "Phản ánh hành vi có dấu hiệu vi phạm của nhà giáo đến cơ quan có thẩm quyền theo đúng quy định của pháp luật"], "answer": 2, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 11 khoản 3 điểm b.", "explanation": ""}, {"id": 56, "set": 2, "number": 16, "level": "Thông hiểu", "text": "Truyền thống nào sau đây là của Công an nhân dân Việt Nam?", "options": ["Quyết chiến, quyết thắng, biết đánh, biết thắng", "Cách đánh du kích trở thành di sản vô giá trong kho tàng Nghệ thuật quân sự Việt Nam", "Cán bộ, chiến sĩ bình đẳng về quyền lợi và nghĩa vụ, trên dưới đồng lòng", "Từ nhân dân mà ra, vì nhân dân phục vụ, dựa vào dân để làm việc và chiến đấu thắng lợi"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 1, tr. 7 – 10.", "explanation": ""}, {"id": 57, "set": 2, "number": 17, "level": "Thông hiểu", "text": "Theo Luật Sĩ quan Quân đội nhân dân Việt Nam, vị trí, chức năng của sĩ quan là gì?", "options": ["Là lực lượng nòng cốt thực hiện nhiệm vụ bảo vệ an ninh quốc gia, bảo đảm trật tự, an toàn xã hội", "Là lực lượng nòng cốt của quân đội và là thành phần chủ yếu trong đội ngũ cán bộ quân đội", "Là lực lượng chuyên làm công tác tuyển quân ở địa phương", "Là lực lượng vũ trang quần chúng không thoát li sản xuất, công tác"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, tr. 12.", "explanation": ""}, {"id": 58, "set": 2, "number": 18, "level": "Thông hiểu", "text": "Nội dung nào sau đây không phải là dấu hiệu để xác định một hành vi vi phạm pháp luật về trật tự an toàn giao thông?", "options": ["Người tham gia giao thông có độ tuổi chịu trách nhiệm pháp lý, có khả năng nhận thức được hậu quả hành vi của mình", "Hành vi của người tham gia giao thông trái với quy định của pháp luật về trật tự an toàn giao thông", "Có lỗi của người thực hiện hành vi khi tham gia giao thông", "Hành vi đó phải gây ra tai nạn giao thông có thiệt hại về người"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, tr. 21 – 22.", "explanation": ""}, {"id": 59, "set": 2, "number": 19, "level": "Thông hiểu", "text": "Vì sao cần cập nhật các phần mềm và hệ điều hành thường xuyên để bảo mật thông tin cá nhân trên mạng?", "options": ["Vì bản cập nhật giúp tăng dung lượng lưu trữ của thiết bị", "Vì bản cập nhật tự động đổi mật khẩu cho người dùng", "Vì các bản cập nhật chứa bản vá bảo mật quan trọng", "Vì bản cập nhật giúp thiết bị kết nối được nhiều mạng Wifi công cộng hơn"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, tr. 34 (Hình 6.3).", "explanation": ""}, {"id": 60, "set": 2, "number": 20, "level": "Thông hiểu", "text": "Theo Luật Biển Việt Nam, vùng tiếp giáp lãnh hải được xác định như thế nào?", "options": ["Là vùng biển tiếp liền và nằm ngoài lãnh hải Việt Nam, có chiều rộng 12 hải lí tính từ ranh giới ngoài của lãnh hải", "Là vùng biển có chiều rộng 24 hải lí tính từ ranh giới ngoài của lãnh hải", "Là vùng biển hợp với lãnh hải thành một vùng biển rộng 200 hải lí tính từ đường cơ sở", "Là vùng biển có chiều rộng 12 hải lí tính từ đường cơ sở ra phía biển"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), tr. 9.", "explanation": ""}, {"id": 61, "set": 2, "number": 21, "level": "Thông hiểu", "text": "Dấu hiệu đặc trưng của tội phạm sử dụng công nghệ cao là gì?", "options": ["Lợi dụng các hình thức vui chơi, giải trí để cá cược, sát phạt nhau bằng tiền hoặc hiện vật", "Biểu hiện thái quá lòng tin mù quáng vào những điều huyền bí, không có thật", "Cố ý sử dụng tri thức, kĩ năng, công cụ, phương tiện công nghệ thông tin ở trình độ cao tác động trái pháp luật đến thông tin số", "Sử dụng vũ khí, công cụ, phương tiện thô sơ trong hoạt động phạm tội"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), tr. 20.", "explanation": ""}, {"id": 62, "set": 2, "number": 22, "level": "Thông hiểu", "text": "Theo pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ, công cụ hỗ trợ được hiểu là gì?", "options": ["Sản phẩm dưới tác động của xung kích thích ban đầu gây ra phản ứng hoá học nhanh, mạnh, toả nhiệt, sinh khí", "Loại vũ khí có cấu tạo và nguyên lí hoạt động đơn giản, được chế tạo thủ công hoặc công nghiệp", "Phương tiện, động vật nghiệp vụ được sử dụng để thi hành công vụ, thực hiện nhiệm vụ bảo vệ", "Loại vũ khí được sử dụng để luyện tập, thi đấu thể thao"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Pháp luật về quản lí vũ khí, vật liệu nổ, công cụ hỗ trợ” (nội dung 10), tr. 47.", "explanation": ""}, {"id": 63, "set": 2, "number": 23, "level": "Thông hiểu", "text": "Mối quan hệ giữa chiến lược “diễn biến hoà bình” và bạo loạn lật đổ được hiểu như thế nào?", "options": ["Hai hoạt động độc lập, không liên quan đến nhau", "Bạo loạn lật đổ luôn diễn ra trước để chuẩn bị tư tưởng, tổ chức cho “diễn biến hoà bình”", "“Diễn biến hoà bình” chỉ được tiến hành sau khi bạo loạn lật đổ thất bại", "“Diễn biến hoà bình” đi trước, tạo điều kiện, thời cơ cho bạo loạn lật đổ; bạo loạn lật đổ là hệ quả của “diễn biến hoà bình”"], "answer": 3, "source": "SGK GDQP-AN 12, bài “Một số hiểu biết về chiến lược “diễn biến hoà bình”, bạo loạn lật đổ” (nội dung 15), tr. 32.", "explanation": ""}, {"id": 64, "set": 2, "number": 24, "level": "Thông hiểu", "text": "Tư tưởng chiến lược tiến công, bám trụ kiên cường của lực lượng vũ trang địa phương được thể hiện như thế nào?", "options": ["Chỉ phòng ngự trong làng, xã; không chủ động tiến công địch", "Chủ yếu rút lui để bảo toàn lực lượng, chờ bộ đội chủ lực đến chi viện rồi mới đánh địch", "Lấy hành động tiến công là chính, kết hợp với phòng ngự chủ động, kiên cường bám trụ (bám dân, bám đất, bám địch)", "Tập trung toàn bộ lực lượng đánh một trận quyết định ngay từ đầu"], "answer": 2, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), tr. 43.", "explanation": ""}, {"id": 65, "set": 2, "number": 25, "level": "Vận dụng", "text": "Giáo viên Giáo dục quốc phòng và an ninh (môn học có 35 tiết/năm học) ra đề kiểm tra cuối học kì trên giấy, đánh giá bằng điểm số. Theo Thông tư 22/2021/TT-BGDĐT, yêu cầu nào đúng?", "options": ["Thời gian làm bài từ 60 phút đến 90 phút; đề do giáo viên tự chọn nội dung", "Thời gian làm bài 45 phút; đề kiểm tra được xây dựng dựa trên ma trận, đặc tả, đáp ứng yêu cầu cần đạt của môn học", "Thời gian làm bài tối đa 120 phút; đề phải gồm cả lí thuyết và thực hành", "Thời gian làm bài 45 phút; không cần ma trận, đặc tả vì là môn học đặc thù"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 7 khoản 1.", "explanation": ""}, {"id": 66, "set": 2, "number": 26, "level": "Vận dụng", "text": "Học sinh E có điểm trung bình môn Giáo dục quốc phòng và an ninh học kì I là 6,4 và học kì II là 7,9. Theo Thông tư 22/2021/TT-BGDĐT, điểm trung bình môn cả năm của E là bao nhiêu?", "options": ["7,9", "7,4", "7,1", "7,2"], "answer": 1, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 9 khoản 1 điểm b: (6,4 + 2×7,9) : 3 = 22,2 : 3 = 7,4.", "explanation": ""}, {"id": 67, "set": 2, "number": 27, "level": "Vận dụng", "text": "Học sinh G phải nằm viện đúng ngày kiểm tra cuối kì môn Giáo dục quốc phòng và an ninh. Theo Thông tư 22/2021/TT-BGDĐT, trường hợp của G được giải quyết như thế nào?", "options": ["G phải thi lại toàn bộ môn học trong kì nghỉ hè", "G được lấy điểm đánh giá giữa kì thay cho điểm đánh giá cuối kì mà không cần kiểm tra bù", "G được miễn kiểm tra và xếp mức Đạt môn học", "G được kiểm tra, đánh giá bù; nếu không tham gia kiểm tra bù thì nhận 0 điểm cho lần kiểm tra còn thiếu"], "answer": 3, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 7 khoản 4, khoản 5.", "explanation": ""}, {"id": 68, "set": 2, "number": 28, "level": "Vận dụng", "text": "Cô K đang dạy tại một trường trung học phổ thông và đã có chứng chỉ đào tạo giáo dục quốc phòng và an ninh với thời gian đào tạo 06 tháng. Theo Luật Giáo dục quốc phòng và an ninh, hình thức đào tạo nào phù hợp để cô K trở thành giáo viên giáo dục quốc phòng và an ninh có văn bằng 2?", "options": ["Đào tạo chính quy, tập trung 04 năm", "Đào tạo văn bằng 2, tập trung 18 tháng", "Bồi dưỡng tập huấn định kì 03 tháng tại trung tâm giáo dục quốc phòng và an ninh", "Đào tạo văn bằng 2, tập trung 02 năm"], "answer": 1, "source": "Luật Giáo dục quốc phòng và an ninh (VBHN số 48/VBHN-VPQH ngày 17/3/2026), Điều 24 khoản 1 điểm c.", "explanation": ""}, {"id": 69, "set": 2, "number": 29, "level": "Vận dụng", "text": "Thầy M đang bị xem xét, xử lý kỷ luật; việc thầy tiếp tục giảng dạy có thể ảnh hưởng đến tâm lý học sinh. Theo Luật Nhà giáo năm 2025, ai có thẩm quyền quyết định tạm đình chỉ giảng dạy đối với thầy M?", "options": ["Ban đại diện cha mẹ học sinh", "Người đứng đầu cơ sở giáo dục nơi thầy M công tác", "Tổ trưởng chuyên môn", "Chủ tịch công đoàn nhà trường"], "answer": 1, "source": "Luật Nhà giáo số 73/2025/QH15, Điều 36 khoản 1.", "explanation": ""}, {"id": 70, "set": 2, "number": 30, "level": "Vận dụng", "text": "Bạn H có nguyện vọng trở thành sĩ quan Quân đội nhưng không đủ điểm tuyển sinh vào trường đào tạo sĩ quan. Từ tình huống Hoàng Phú Thịnh trong sách giáo khoa lớp 10, hướng phấn đấu nào phù hợp với H?", "options": ["Chờ đủ 27 tuổi rồi đăng kí dự tuyển lại", "Tình nguyện nhập ngũ, vừa rèn luyện vừa ôn luyện để tiếp tục dự tuyển vào trường sĩ quan", "Đề nghị địa phương cử đi học sĩ quan không qua tuyển sinh", "Từ bỏ nguyện vọng vì chỉ được dự tuyển một lần"], "answer": 1, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 2, tr. 14 – 15.", "explanation": ""}, {"id": 71, "set": 2, "number": 31, "level": "Vận dụng", "text": "Một học sinh cần qua đường tại nơi không có đèn tín hiệu, không có vạch kẻ đường, cầu vượt, hầm dành cho người đi bộ. Theo quy định, học sinh đó phải làm gì?", "options": ["Giơ tay xin đường và băng qua ngay, các phương tiện phải nhường", "Không được qua đường tại vị trí đó trong mọi trường hợp", "Chạy thật nhanh qua đường để rút ngắn thời gian", "Quan sát các xe đang đi tới, chỉ qua đường khi bảo đảm an toàn"], "answer": 3, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 4, tr. 24.", "explanation": ""}, {"id": 72, "set": 2, "number": 32, "level": "Vận dụng", "text": "Bạn P nhận được tin nhắn từ số lạ thông báo “trúng thưởng”, yêu cầu bấm vào đường dẫn và điền thông tin tài khoản ngân hàng để nhận quà. Nhận định và cách xử lí nào đúng?", "options": ["Chỉ cần điền thông tin bằng mạng Wifi công cộng thì sẽ an toàn", "Chuyển tiếp tin nhắn cho bạn bè để cùng nhận thưởng", "Đây là thủ đoạn dụ người dùng vào trang mạng lập sẵn để đánh cắp dữ liệu cá nhân; không truy cập, không điền thông tin", "Đây là dịch vụ chăm sóc khách hàng thông thường của ngân hàng; nên điền đầy đủ thông tin để nhận quà"], "answer": 2, "source": "SGK GDQP-AN 10 (Kết nối tri thức), Bài 6, tr. 34.", "explanation": ""}, {"id": 73, "set": 2, "number": 33, "level": "Vận dụng", "text": "Gia đình Dũng có hai mẹ con; mẹ Dũng mắc bệnh hiểm nghèo, không còn khả năng lao động và Dũng là lao động duy nhất trực tiếp nuôi dưỡng mẹ. Theo Luật Nghĩa vụ quân sự, trường hợp của Dũng được giải quyết như thế nào?", "options": ["Dũng vẫn phải nhập ngũ, địa phương có trách nhiệm chăm sóc mẹ thay Dũng", "Dũng thuộc diện được tạm hoãn gọi nhập ngũ, không thuộc diện miễn gọi nhập ngũ", "Dũng được miễn gọi nhập ngũ", "Dũng không được đăng kí nghĩa vụ quân sự"], "answer": 1, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), tr. 13 – 14.", "explanation": ""}, {"id": 74, "set": 2, "number": 34, "level": "Vận dụng", "text": "Có ý kiến cho rằng: “Để được thực hiện nghĩa vụ tham gia Công an nhân dân, mọi công dân phải có bằng tốt nghiệp trung học phổ thông trở lên”. Theo Nghị định số 70/2019/NĐ-CP, ý kiến này đúng hay sai?", "options": ["Đúng, vì tiêu chuẩn về trình độ học vấn được áp dụng thống nhất trong cả nước, không có ngoại lệ", "Đúng, và riêng vùng khó khăn phải có bằng trung cấp trở lên", "Sai, vì các xã miền núi, hải đảo, vùng đặc biệt khó khăn được tuyển công dân có bằng tốt nghiệp trung học cơ sở", "Sai, vì chỉ cần hoàn thành chương trình tiểu học"], "answer": 2, "source": "SGK GDQP-AN 11, bài “Luật Nghĩa vụ quân sự và trách nhiệm của học sinh” (nội dung 11), tr. 16.", "explanation": ""}, {"id": 75, "set": 2, "number": 35, "level": "Vận dụng", "text": "Trong mùa giải bóng đá, một số bạn rủ T góp tiền cá độ tỉ số trận đấu. Nhận định và cách ứng xử nào đúng?", "options": ["Cá độ bóng đá là hành vi đánh bạc trái phép, thuộc tệ nạn cờ bạc; T cần từ chối tham gia", "Cá độ với số tiền nhỏ giữa bạn bè cùng lớp thì không bị coi là đánh bạc trái phép", "Được phép tham gia nếu đã đủ 16 tuổi", "Chỉ bị coi là vi phạm khi cá độ qua mạng Internet"], "answer": 0, "source": "SGK GDQP-AN 11, bài “Phòng chống tệ nạn xã hội ở Việt Nam trong thời kì hội nhập quốc tế” (nội dung 8), tr. 22 – 23.", "explanation": ""}, {"id": 76, "set": 2, "number": 36, "level": "Vận dụng", "text": "Trên mạng xã hội xuất hiện luận điệu cho rằng việc quân tình nguyện Việt Nam có mặt ở Campuchia năm 1979 là “xâm lược”. Lập luận nào phù hợp để phản bác?", "options": ["Đó là hành động tự vệ chính đáng, chính nghĩa; quân tình nguyện Việt Nam thực hiện lời kêu gọi của Mặt trận Đoàn kết dân tộc cứu nước Campuchia", "Quân đội Việt Nam hành động theo yêu cầu của tập đoàn Pol Pot – Ieng Sary", "Việt Nam chủ động tiến công trước nhằm mở rộng lãnh thổ về phía Tây Nam, không liên quan đến chế độ diệt chủng", "Đó là việc riêng của hai nước nên học sinh không cần quan tâm, không cần phản bác"], "answer": 0, "source": "SGK GDQP-AN 12, bài “Bảo vệ Tổ quốc Việt Nam xã hội chủ nghĩa sau năm 1975” (nội dung 12), tr. 6 – 7, 12.", "explanation": ""}, {"id": 77, "set": 2, "number": 37, "level": "Vận dụng cao", "text": "Kết quả rèn luyện của ba học sinh như sau: An – học kì I mức Tốt, học kì II mức Đạt; Bình – học kì I mức Chưa đạt, học kì II mức Khá; Cường – học kì I mức Đạt, học kì II mức Tốt. Theo Thông tư 22/2021/TT-BGDĐT, kết quả rèn luyện cả năm học của An, Bình, Cường lần lượt là gì?", "options": ["Khá, Đạt, Khá", "Khá, Khá, Tốt", "Đạt, Đạt, Tốt", "Tốt, Chưa đạt, Khá"], "answer": 0, "source": "Thông tư 22/2021/TT-BGDĐT, Điều 8 khoản 2 điểm b.", "explanation": ""}, {"id": 78, "set": 2, "number": 38, "level": "Vận dụng cao", "text": "Năm 2026, tại các cơ sở giáo dục phổ thông công lập: thầy Q là giáo viên trung học phổ thông ở một phường trung tâm thành phố; cô R là giáo viên trung học phổ thông ở một xã biên giới; anh S là nhân viên thiết bị trường học ở phường trung tâm. Theo Nghị quyết số 248/2025/QH15, mức phụ cấp ưu đãi nghề (thực hiện theo lộ trình do Chính phủ quy định) của ba người được xác định như thế nào?", "options": ["Cả ba người đều tối thiểu 70%", "Thầy Q và cô R đều 100%; anh S tối thiểu 70%", "Thầy Q tối thiểu 30%; cô R tối thiểu 70%; anh S không được hưởng", "Thầy Q tối thiểu 70%; cô R 100%; anh S tối thiểu 30%"], "answer": 3, "source": "Nghị quyết số 248/2025/QH15, Điều 2 khoản 2 điểm a.", "explanation": ""}, {"id": 79, "set": 2, "number": 39, "level": "Vận dụng cao", "text": "Điểm M nằm trên biển cách đường cơ sở của Việt Nam 18 hải lí; điểm N cách đường cơ sở 210 hải lí. Theo Luật Biển Việt Nam, nhận định nào đúng?", "options": ["M nằm trong nội thuỷ; N nằm ngoài mọi vùng biển Việt Nam", "M nằm trong lãnh hải; N nằm trong vùng đặc quyền kinh tế", "M nằm trong vùng tiếp giáp lãnh hải; N chắc chắn nằm ngoài thềm lục địa vì thềm lục địa chỉ rộng 200 hải lí", "M nằm trong vùng tiếp giáp lãnh hải; N nằm ngoài vùng đặc quyền kinh tế nhưng đáy biển tại đó vẫn có thể thuộc thềm lục địa Việt Nam"], "answer": 3, "source": "SGK GDQP-AN 11, bài “Bảo vệ chủ quyền lãnh thổ, biên giới quốc gia” (nội dung 7), tr. 9 (lãnh hải 12 hải lí; vùng tiếp giáp 12 hải lí tiếp theo; vùng đặc quyền kinh tế 200 hải lí; thềm lục địa không quá 350 hải lí).", "explanation": ""}, {"id": 80, "set": 2, "number": 40, "level": "Vận dụng cao", "text": "Phân tích mối quan hệ tác chiến giữa lực lượng vũ trang địa phương và bộ đội chủ lực trong nghệ thuật đánh giặc giữ nước, nhận định nào phản ánh đúng nội dung sách giáo khoa lớp 12?", "options": ["Bộ đội chủ lực đánh nhỏ lẻ, rộng khắp để lực lượng vũ trang địa phương thực hành các trận đánh tập trung tiêu diệt địch", "Lực lượng vũ trang địa phương đánh nhỏ lẻ, rộng khắp, liên tục, buộc địch phân tán đối phó, tạo điều kiện cho bộ đội chủ lực đánh tập trung", "Hai lực lượng tác chiến độc lập, không cần phối hợp, hiệp đồng trên địa bàn", "Lực lượng vũ trang địa phương chỉ làm nhiệm vụ hậu cần, không trực tiếp chiến đấu"], "answer": 1, "source": "SGK GDQP-AN 12, bài “Truyền thống và nghệ thuật đánh giặc giữ nước của địa phương” (nội dung 16), tr. 43 – 44.", "explanation": ""}];</script><script>const $=s=>document.querySelector(s), esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='gdqp-2de-thpt-80-20261123-v1';let db;try{db=JSON.parse(localStorage.getItem(KEY))||{wrong:[],bookmarks:[],history:[]}}catch{db={wrong:[],bookmarks:[],history:[]}}let active=null,timer=null;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch{}};const bank=QUESTIONS.filter(q=>!q.placeholder);const shuffle=a=>a.map(x=>[Math.random(),x]).sort((a,b)=>a[0]-b[0]).map(x=>x[1]);
function dashboard(){clearInterval(timer);active=null;$('#app').innerHTML=`<section class="hero"><div><div class="eyebrow">GDQP&AN · Tài liệu ôn luyện được cung cấp</div><h1>Ôn luyện GDQP&AN THPT</h1><p>80 câu hỏi · Hai đề độc lập, mỗi đề 40 câu. Luyện từng câu, tra cứu tài liệu và xem lại kết quả.</p><button class="lime" data-start="practice">Luyện tổng hợp 80 câu →</button></div><div class="emblem">★<small>ÔN TẬP KIẾN THỨC</small></div></section><section class="stats"><div class="stat"><strong>80</strong><span class="muted">Câu hỏi đầy đủ</span></div><div class="stat"><strong>${db.history.length}</strong><span class="muted">Lượt đã hoàn thành</span></div><div class="stat"><strong>${db.wrong.length}</strong><span class="muted">Câu cần ôn lại</span></div><div class="stat"><strong>${db.bookmarks.length}</strong><span class="muted">Câu đã đánh dấu</span></div></section><div class="notice">Nội dung, đáp án và nguồn dẫn được nhập từ file anh cung cấp, chưa thẩm định lại. Nguồn đối chiếu được hiển thị khi kiểm tra đáp án. Đáp án đã được đối chiếu giữa nội dung từng câu và bảng đáp án cuối mỗi đề; chưa thẩm định lại kiến thức và hiệu lực văn bản. Vị trí phương án được đảo khi luyện. Thời gian thi thử do anh chọn, không phải thời gian quy định trong tài liệu.</div><div class="panel"><h3>Thiết lập thời gian mỗi đề</h3><select id="duration" aria-label="Thời gian thi thử"><option value="40" selected>40 phút</option><option value="50">50 phút</option><option value="60">60 phút</option></select></div><h2 style="margin-top:25px">Chọn bộ đề</h2><section class="grid">${[1,2].map(n=>`<article class="card"><span class="tag">ĐỀ ${n} · 40 CÂU</span><h3>Đề ${n}</h3><button data-topic="${n}">Luyện từng câu →</button><button class="primary" data-exam="${n}">Thi thử đề ${n} →</button></article>`).join('')}<article class="card"><h3>Củng cố kiến thức</h3><button data-start="wrong">Ôn câu sai (${db.wrong.length})</button><button data-start="bookmarks">Câu đánh dấu (${db.bookmarks.length})</button></article></section><h2 style="margin-top:30px">Tra cứu câu hỏi</h2><div class="tools"><input id="search" placeholder="Tìm nội dung câu hỏi…" aria-label="Tìm câu hỏi"><select id="level" aria-label="Mức độ"><option value="">Tất cả mức độ</option>${[...new Set(bank.map(q=>q.level))].map(l=>`<option>${esc(l)}</option>`).join('')}</select><button id="browse">Tra cứu</button></div><div id="searchResults"></div><h2 style="margin-top:30px">Lịch sử luyện tập</h2>${db.history.slice(0,10).map(h=>`<div class="history row"><span>${esc(h.mode)} · ${esc(h.date)}</span><b>${h.correct}/${h.total} câu đúng · ${h.score}/10</b></div>`).join('')||'<p class="muted">Chưa có lượt hoàn thành.</p>'}<p class="muted">Tiến độ được lưu trên trình duyệt và thiết bị đang sử dụng.</p>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>start(b.dataset.start));document.querySelectorAll('[data-topic]').forEach(b=>b.onclick=()=>start('practice',+b.dataset.topic));document.querySelectorAll('[data-exam]').forEach(b=>b.onclick=()=>start('exam',+b.dataset.exam));$('#browse').onclick=browse;$('#search').oninput=browse;$('#level').onchange=browse}
function browse(){let s=$('#search').value.toLocaleLowerCase('vi'),l=$('#level').value;let list=bank.filter(q=>(!l||q.level===l)&&(q.text+' '+q.options.join(' ')).toLocaleLowerCase('vi').includes(s));$('#searchResults').innerHTML=`<p class="muted">${list.length} câu phù hợp</p>`+list.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${esc(q.level)}</span><p>${esc(q.text)}</p><details><summary>Xem phương án và đáp án từ tài liệu</summary>${q.options.map((o,i)=>`<p>${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓':''}</p>`).join('')}</details></div>`).join('')}
function start(mode,topic){let minutes=Number($('#duration')?.value||50);let qs=mode==='wrong'?bank.filter(q=>db.wrong.includes(q.id)):mode==='bookmarks'?bank.filter(q=>db.bookmarks.includes(q.id)):bank.slice();if(topic)qs=qs.filter(q=>q.set===topic);qs=qs.map(q=>{let opts=shuffle(q.options.map((text,index)=>({text,index})));return {...q,options:opts.map(o=>o.text),answer:opts.findIndex(o=>o.index===q.answer)}});if(!qs.length){alert('Chưa có câu trong danh sách này. Anh hãy luyện hoặc đánh dấu câu trước nhé.');return}if(mode!=='exam')qs=shuffle(qs);active={mode,qs,answers:{},revealed:{},i:0,end:Date.now()+minutes*60000};renderQuiz();if(mode==='exam')timer=setInterval(()=>{if(!active)return;let remain=Math.max(0,Math.ceil((active.end-Date.now())/1000));let el=$('#clock');if(el)el.textContent=fmt(remain);if(!remain)finish(false)},1000)}
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function renderQuiz(){let a=active,q=a.qs[a.i],ans=a.answers[q.id],show=a.revealed[q.id],done=Object.keys(a.answers).length;$('#app').innerHTML=`<div class="row"><div><div class="eyebrow" style="color:#627d50">${a.mode==='exam'?`THI THỬ · BỘ ĐỀ ${a.qs[0].set}`:'LUYỆN TẬP · PHẢN HỒI TỪNG CÂU'}</div><h2>Vững kiến thức, tự tin hơn</h2></div><button id="exit">Thoát</button></div><div class="quiz"><section class="panel"><div class="row"><span class="tag">Câu ${a.i+1}/${a.qs.length} · ${esc(q.level)}</span><button id="bookmark" aria-label="Đánh dấu câu">${db.bookmarks.includes(q.id)?'★ Đã đánh dấu':'☆ Đánh dấu'}</button></div><div class="question">${esc(q.text)}</div>${q.options.map((o,i)=>`<button class="option ${ans===i?'selected':''} ${show&&i===q.answer?'correct':''} ${show&&ans===i&&i!==q.answer?'wrong':''}" data-option="${i}" ${show?'disabled':''}><b>${'ABCD'[i]}</b><span>${esc(o)}</span></button>`).join('')}${show?`<div class="answer-note">${q.explanation?`<p>${esc(q.explanation)}</p>`:''}<b>${ans===q.answer?'✓ Trùng đáp án tài liệu':'Đáp án tài liệu: '+ 'ABCD'[q.answer]}</b><div class="muted">Nguồn dẫn trong file: ${esc(q.source)} · Câu gốc ${q.number}. Chưa thẩm định nguồn.</div></div>`:''}<div class="row" style="margin-top:22px"><button id="prev" ${a.i===0?'disabled':''}>← Trước</button>${a.mode!=='exam'&&!show?`<button class="primary" id="check" ${ans===undefined?'disabled':''}>Kiểm tra đáp án</button>`:''}<button id="next" ${a.i===a.qs.length-1?'disabled':''}>Tiếp →</button></div></section><aside class="panel">${a.mode==='exam'?`<div class="muted">Thời gian còn lại</div><div class="timer" id="clock">${fmt(Math.max(0,Math.ceil((a.end-Date.now())/1000)))}</div>`:'<h3>Tiến độ luyện tập</h3>'}<div class="muted">Đã chọn ${done}/${a.qs.length} câu</div><div class="progress"><i style="width:${done/a.qs.length*100}%"></i></div><div class="numbers">${a.qs.map((v,i)=>`<button data-jump="${i}" class="${a.answers[v.id]!==undefined?'selected':''} ${i===a.i?'current':''}">${i+1}${db.bookmarks.includes(v.id)?'★':''}</button>`).join('')}</div><button class="primary" style="width:100%" id="finish">${a.mode==='exam'?'Nộp bài':'Kết thúc & xem kết quả'}</button><p class="muted">${a.mode==='exam'?'Đáp án hiển thị sau khi nộp bài.':'Chọn phương án rồi nhấn Kiểm tra đáp án.'}</p></aside></div>`;document.querySelectorAll('[data-option]').forEach(b=>b.onclick=()=>{a.answers[q.id]=+b.dataset.option;renderQuiz()});document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{a.i=+b.dataset.jump;renderQuiz()});$('#prev').onclick=()=>{a.i--;renderQuiz()};$('#next').onclick=()=>{a.i++;renderQuiz()};if($('#check'))$('#check').onclick=()=>{a.revealed[q.id]=true;renderQuiz()};$('#bookmark').onclick=()=>{db.bookmarks=db.bookmarks.includes(q.id)?db.bookmarks.filter(id=>id!==q.id):[...db.bookmarks,q.id];save();renderQuiz()};$('#exit').onclick=()=>{if(confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};$('#finish').onclick=()=>finish(true)}
function finish(ask){if(!active)return;let a=active,missing=a.qs.length-Object.keys(a.answers).length;if(ask&&!confirm(missing?`Còn ${missing} câu chưa chọn. Anh muốn kết thúc và chấm bài?`:'Kết thúc và chấm bài?'))return;clearInterval(timer);let correct=a.qs.filter(q=>a.answers[q.id]===q.answer).length;for(let q of a.qs){if(a.answers[q.id]===q.answer)db.wrong=db.wrong.filter(id=>id!==q.id);else if(!db.wrong.includes(q.id))db.wrong.push(q.id)}let score=(correct/a.qs.length*10).toFixed(2);db.history.unshift({mode:(a.mode==='exam'?'Thi thử':'Luyện tập')+(a.qs.every(q=>q.set===a.qs[0].set)?' đề '+(a.qs[0].set):' tổng hợp'),date:new Date().toLocaleString('vi-VN'),correct,total:a.qs.length,score});db.history=db.history.slice(0,50);save();$('#app').innerHTML=`<section class="panel score"><span class="tag">ĐÃ HOÀN THÀNH</span><h1>Kết quả của anh</h1><strong>${score}<small style="font-size:20px">/10</small></strong><p>${correct}/${a.qs.length} câu trùng đáp án tài liệu · ${missing} câu chưa trả lời</p><div class="tools" style="justify-content:center"><button class="primary" id="again">Ôn câu sai</button><button id="back">Về tổng quan</button></div><p class="muted">Điểm luyện tập được quy đổi tuyến tính theo số câu đúng, không thay thế thang điểm hội thi.</p></section><h2 style="margin-top:28px">Xem lại bài làm</h2><section class="panel">${a.qs.map(q=>`<div class="review-item"><span class="tag">Đề ${q.set} · Câu ${q.number} · ${a.answers[q.id]===q.answer?'Đúng theo tài liệu':'Cần ôn lại'}</span><p><b>${esc(q.text)}</b></p><p class="muted">Nguồn dẫn trong file: ${esc(q.source)}</p>${q.options.map((o,i)=>`<p style="color:${i===q.answer?'#26763d':a.answers[q.id]===i?'#b35543':'inherit'}">${'ABCD'[i]}. ${esc(o)} ${i===q.answer?'✓ Đáp án tài liệu':''}${a.answers[q.id]===i?' · Anh chọn':''}</p>`).join('')}</div>`).join('')}</section>`;active=null;$('#again').onclick=()=>start('wrong');$('#back').onclick=dashboard;window.scrollTo(0,0)}
$('#home').onclick=$('#logo').onclick=e=>{e.preventDefault();if(!active||confirm('Thoát lượt đang làm? Kết quả lượt này chưa được lưu.'))dashboard()};dashboard();
</script></body></html>
